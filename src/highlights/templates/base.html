<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f5f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111615" media="(prefers-color-scheme: dark)">
  <title>{% block title %}Highlights{% endblock %}</title>
  <link rel="manifest" href="{{ base }}/manifest.webmanifest">
  <link rel="icon" href="{{ base }}/static/icon-192.png">
  <link rel="apple-touch-icon" href="{{ base }}/static/icon-192.png">
  <link rel="stylesheet" href="{{ base }}/static/app.css?v=1">
</head>
<body data-base="{{ base }}" {% block body_attrs %}{% endblock %}>
  <header class="top">
    {% block header %}
    <a class="brand" href="{{ base }}/">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M10 9.2v5.6l4.8-2.8z"/></svg>
      Highlights
    </a>
    {% endblock %}
  </header>
  <main class="wrap">
    {% if missing %}
    <section class="notice warn" role="status">
      <strong>Setup isn't finished.</strong>
      Add {{ missing | join(" and ") }} to the settings file (<code>.env</code>), then restart Highlights.
    </section>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
  {% block bar %}{% endblock %}
  <script src="{{ base }}/static/app.js?v=1" defer></script>
</body>
</html>

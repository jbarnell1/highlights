name: publish image

# Builds the Highlights image and pushes it to GitHub Container Registry with a signed build
# provenance record. Runs on every v* tag (pushes <version> and latest), and by hand:
#   gh workflow run publish-image.yml -f version=0.2.0 -f push=true

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, like 0.2.0 (no leading v). Empty reads pyproject.toml.'
        required: false
        default: ''
      push:
        description: 'Push to ghcr.io (false builds only).'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Version and tags
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUSH: ${{ inputs.push }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = push ]; then V="${REF_NAME#v}"; PUSH=true
          else V="$INPUT_VERSION"; PUSH="$INPUT_PUSH"
            [ -n "$V" ] || V=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
          fi
          case "$V" in [0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::bad version '$V'"; exit 1;; esac
          IMAGE="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/highlights"
          { echo "version=$V"; echo "image=$IMAGE"; echo "push=$PUSH"
            echo "tags<<EOF"; echo "$IMAGE:$V"; echo "$IMAGE:latest"; echo "EOF"; } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - if: steps.meta.outputs.push == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ steps.meta.outputs.push == 'true' }}
          provenance: mode=max
          sbom: ${{ steps.meta.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - if: steps.meta.outputs.push == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.meta.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.2"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q
  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t highlights:ci .
      - name: The image runs and its tools are present
        run: |
          docker run --rm --entrypoint sh highlights:ci -c \
            'hl --help >/dev/null && claude --version && /usr/lib/jellyfin-ffmpeg/ffmpeg -hide_banner -encoders | grep -q h264_qsv'

name: Feature request
description: Suggest something Highlights could do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Highlights is kept small on purpose: Immich is the editor and the player, and this app
        finds events, picks moments and renders. See docs/DECISIONS.md and docs/ROADMAP.md for
        what has been decided and what is planned.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The situation, not the solution. What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like to see
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
      description: Workarounds or other tools you have tried.
  - type: checkboxes
    id: help
    attributes:
      label: Would you work on it
      options:
        - label: I could open a pull request for this

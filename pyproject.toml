[project]
name = "highlights"
version = "0.2.1"
description = "Turns trips and months in Immich into highlight videos, with a phone PWA to follow and approve each step."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "jinja2>=3.1",
    "pillow>=11.0",
    "pydantic>=2.9",
    "python-multipart>=0.0.12",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]

[project.scripts]
hl = "highlights.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/highlights"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
